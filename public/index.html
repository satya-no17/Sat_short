<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sat_short - URL Shortener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 50%, #020617 100%);
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.35);
      --accent: #a855f7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --input-bg: rgba(2, 6, 23, 0.6);
      --input-border: rgba(255, 255, 255, 0.12);
      --success: #10b981;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #e2e8f0;
      margin-bottom: 8px;
    }

    input[type="url"] {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="url"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    input::placeholder {
      color: #64748b;
    }

    .duration-presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .preset-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      padding: 10px 8px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .preset-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .preset-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
      box-shadow: 0 0 12px var(--primary-glow);
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 20px -4px var(--primary-glow);
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px -4px var(--primary-glow);
      opacity: 0.95;
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .alert {
      display: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      margin-top: 16px;
      animation: fadeIn 0.2s ease;
    }

    .alert.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .alert.warning {
      display: block;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fcd34d;
    }

    .result-box {
      display: none;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      animation: slideUp 0.3s ease;
    }

    .result-box.visible {
      display: block;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .result-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #a5b4fc;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .result-expiry {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .result-url-wrapper {
      display: flex;
      gap: 8px;
    }

    .result-url-input {
      flex: 1;
      background: rgba(2, 6, 23, 0.8);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 10px;
      padding: 12px 14px;
      color: #c7d2fe;
      font-weight: 600;
      font-size: 0.95rem;
      outline: none;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      border-radius: 10px;
      padding: 0 16px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .icon-btn.copied {
      background: var(--success);
      border-color: var(--success);
      color: #ffffff;
    }

    .open-btn {
      background: rgba(99, 102, 241, 0.2);
      border-color: rgba(99, 102, 241, 0.4);
      color: #c7d2fe;
    }

    .open-btn:hover {
      background: rgba(99, 102, 241, 0.35);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .submit-btn.loading .btn-text {
      display: none;
    }

    .submit-btn.loading .spinner {
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Sat_short</h1>
      <p class="subtitle">Fast, temporary URL shortener with sliding-window rate limiting.</p>
    </div>

    <div class="card">
      <form id="shortenerForm">
        <div class="form-group">
          <label for="longUrl">Destination URL</label>
          <input type="url" id="longUrl" placeholder="https://github.com/satya-no17/Sat_short" required autofocus>
        </div>

        <div class="form-group">
          <label>Link Expiration</label>
          <div class="duration-presets">
            <button type="button" class="preset-btn active" data-time="5">5s</button>
            <button type="button" class="preset-btn" data-time="10">10s</button>
            <button type="button" class="preset-btn" data-time="30">30s</button>
            <button type="button" class="preset-btn" data-time="60">60s</button>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          <span class="btn-text">Shorten URL</span>
          <div class="spinner"></div>
        </button>
      </form>

      <div id="alertBox" class="alert"></div>

      <div id="resultBox" class="result-box">
        <div class="result-header">
          <span class="result-title">Shortened Link</span>
          <span class="result-expiry" id="expiryText">Expires in 5s</span>
        </div>
        <div class="result-url-wrapper">
          <input type="text" class="result-url-input" id="resultUrl" readonly>
          <button type="button" class="icon-btn" id="copyBtn">Copy</button>
          <button type="button" class="icon-btn open-btn" id="openBtn">Open</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let selectedTime = 5;
    const presetButtons = document.querySelectorAll('.preset-btn');
    const form = document.getElementById('shortenerForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('alertBox');
    const resultBox = document.getElementById('resultBox');
    const resultUrl = document.getElementById('resultUrl');
    const expiryText = document.getElementById('expiryText');
    const copyBtn = document.getElementById('copyBtn');
    const openBtn = document.getElementById('openBtn');

    presetButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        presetButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedTime = parseInt(btn.getAttribute('data-time'), 10);
      });
    });

    function showAlert(message, type = 'error') {
      alertBox.textContent = message;
      alertBox.className = `alert ${type}`;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      alertBox.style.display = 'none';
      alertBox.textContent = '';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      resultBox.classList.remove('visible');

      const longUrl = document.getElementById('longUrl').value.trim();
      const duration = selectedTime;

      submitBtn.classList.add('loading');
      submitBtn.disabled = true;

      try {
        const response = await fetch('/url/shortening', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            longUrl: longUrl,
            time: duration
          })
        });

        const data = await response.json();

        if (response.status === 429) {
          showAlert('⏳ Rate limit exceeded: You can only make 5 requests per minute.', 'warning');
          return;
        }

        if (!response.ok) {
          showAlert(data.message || 'Failed to shorten URL. Please try again.');
          return;
        }

        resultUrl.value = data.url;
        expiryText.textContent = `Expires in ${duration}s`;
        resultBox.classList.add('visible');
      } catch (err) {
        showAlert('Network error: Could not connect to the server.');
      } finally {
        submitBtn.classList.remove('loading');
        submitBtn.disabled = false;
      }
    });

    copyBtn.addEventListener('click', async () => {
      if (!resultUrl.value) return;
      try {
        await navigator.clipboard.writeText(resultUrl.value);
        copyBtn.textContent = 'Copied!';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'Copy';
          copyBtn.classList.remove('copied');
        }, 2000);
      } catch (err) {
        resultUrl.select();
        document.execCommand('copy');
      }
    });

    openBtn.addEventListener('click', () => {
      if (resultUrl.value) {
        window.open(resultUrl.value, '_blank');
      }
    });
  </script>
</body>
</html>
